name: HorseToga
options:
  bundleIdPrefix: com.jasonchan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  HorseToga:
    type: application
    platform: macOS
    sources:
      - path: HorseToga
        excludes:
          - "Resources/Themes"
      # Folder reference: theme folders land in the bundle as Themes/<Name>.horsetogatheme/…
      - path: HorseToga/Resources/Themes
        type: folder
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        INFOPLIST_FILE: HorseToga/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HorseToga/Resources/HorseToga.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonchan.horsetoga
        # Debug signs with a free self-signed identity so the app's code identity is
        # STABLE across rebuilds. Ad-hoc signing changes identity every build, which
        # makes macOS re-prompt for Keychain access each time. Create the cert once:
        # Keychain Access ▸ Certificate Assistant ▸ Create a Certificate (Code Signing),
        # name "HorseToga Signing". Release overrides this with Developer ID below when
        # HORSETOGA_TEAM_ID is set. Pass HORSETOGA_TEAM_ID=XXXXXXXXXX for a signed release.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: HorseToga Signing
        DEVELOPMENT_TEAM: $(HORSETOGA_TEAM_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.1.0
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp
  HorseTogaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HorseTogaTests
    dependencies:
      - target: HorseToga
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonchan.horsetoga.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HorseToga:
    build:
      targets:
        HorseToga: all
        HorseTogaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HorseTogaTests
